# Integration environment for horde: one coordinator and two workers.
#
# All three services use the same image built from the repo Dockerfile. Workers
# connect to the coordinator via `HORDE_SERVER_LEADER=coordinator:13420` and run in
# worker mode; local agent functionality is not blocked while the leader
# connection is being established.
#
# Run:  docker compose -f docker/docker-compose.yml up --build
#       (or `task docker:up`)
#
# Ports are mapped to distinct host ports so all three nodes can be inspected
# simultaneously. The container-internal port is always 13420.

services:
  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile
    image: horde:dev
    container_name: horde-coordinator
    command: ["serve", "--mode", "coordinator"]
    environment:
      HORDE_MODE: "coordinator"
      HORDE_ENV: "integration"
      HORDE_LOG_FORMATTER: "json"
      HORDE_LOG_LEVEL: "info"
      HORDE_CLUSTER_NODE_ID: "coordinator"
    ports:
      - "13420:13420"
    networks:
      - horde

  worker1:
    image: horde:dev
    container_name: horde-worker-1
    command: ["serve", "--mode", "worker"]
    environment:
      HORDE_MODE: "worker"
      HORDE_ENV: "integration"
      HORDE_LOG_FORMATTER: "json"
      HORDE_LOG_LEVEL: "info"
      HORDE_SERVER_LEADER: "coordinator:13420"
      HORDE_CLUSTER_NODE_ID: "worker-1"
      HORDE_CLUSTER_ADVERTISE_ADDR: "worker1:13420"
    ports:
      - "13421:13420"
    depends_on:
      - coordinator
    networks:
      - horde

  worker2:
    image: horde:dev
    container_name: horde-worker-2
    command: ["serve", "--mode", "worker"]
    environment:
      HORDE_MODE: "worker"
      HORDE_ENV: "integration"
      HORDE_LOG_FORMATTER: "json"
      HORDE_LOG_LEVEL: "info"
      HORDE_SERVER_LEADER: "coordinator:13420"
      HORDE_CLUSTER_NODE_ID: "worker-2"
      HORDE_CLUSTER_ADVERTISE_ADDR: "worker2:13420"
    ports:
      - "13422:13420"
    depends_on:
      - coordinator
    networks:
      - horde

networks:
  horde:
    driver: bridge
